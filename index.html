    <section>
      <h2>Core Engineering Disciplines</h2>
      <ul>
        <li><strong>Artificial Intelligence:</strong> Autonomous multi-agent systems, AI governance and safety harnesses, universal LLM harnesses, local inference optimization, model routing, reinforcement learning.</li>
        <li><strong>Formal Methods &amp; Control Theory:</strong> Z3 SMT verification, Linear Temporal Logic (LTL), Signal Temporal Logic (STL), Lyapunov stability, Control Barrier Functions, invariant checking.</li>
        <li><strong>Mathematics:</strong> Optimization, probability, graph structures, algebraic topology (Betti numbers), phase transition analysis, cooperative game theory (Shapley values, mechanism design).</li>
        <li><strong>Distributed Systems:</strong> CRDT-based distributed state, Byzantine fault tolerance, deterministic merging, partition handling, distributed transactions with escrow mechanisms.</li>
        <li><strong>Systems &amp; Low-Level Engineering:</strong> Custom operating systems (kernel, memory management, scheduling), runtime engines, compiler design for constrained hardware, Linux internals.</li>
        <li><strong>Hardware Engineering:</strong> Board-level diagnostics using soldering iron and multimeter, salvaged PC assembly, embedded electronics (ESP8266, Raspberry Pi), home automation, custom Android kernels and ROM debugging.</li>
      </ul>

    <hr style="border: 0; border-top: 1px solid #0d0d12; margin: 32px 0;">

    <section>
      <h2>Key Architectural Systems</h2>
      
      <article>
        <h3>POLARIS: AI Governance and Sovereign Intelligence Engine</h3>
        <p>A universal, model-agnostic harness that enforces safety, governance, and provenance constraints on arbitrary LLMs without requiring model retraining. Combines multi-agent reasoning with formal verification (Z3), topological and phase-transition analysis, game-theoretic mechanisms, and Byzantine resilience.</p>
      </article>

      <article>
        <h3>SENTINEL: Autonomous Incident Response System</h3>
        <p>An autonomous SRE architecture employing specialized cooperating agents and tool integrations for incident detection, blast-radius calculation, confidence scoring with temporal decay, and human approval gates. Built for the ANVIL Hackathon.</p>
      </article>

      <article>
        <h3>ANDROMEDA: CRDT-Based Distributed OLTP Engine</h3>
        <p>A distributed transactional engine exploring how relational invariants (foreign keys, uniqueness via escrow) can be preserved deterministically under network partitions and concurrent writes.</p>
      </article>

      <article>
        <h3>INDRA: Citizen State-Transition Engine for Public Infrastructure</h3>
        <p>Ranked 45 and Top 250 at Build What Moves India. Workflow execution and reconciliation platform designed to survive intermittent service outages with transactional integrity, state resumption, and cryptographic provenance.</p>
      </article>

      <article>
        <h3>NEBULA: Persistent Context Engine for Autonomous SRE</h3>
        <p>Transforms raw operational telemetry and incident history into persistent, evolving topological memory for recurring failure diagnosis.</p>
      </article>

      <article>
        <h3>ZENITH: Precision-Controlled Memory Agent</h3>
        <p>Investigates per-dimension attractor control in agent memory architectures, exploring extensions of attractor dynamics in autonomous agents.</p>
      </article>

      <article>
        <h3>GARGANTUA: Unified Autonomous Intelligence Meta-Architecture</h3>
        <p>An overarching framework integrating reasoning, governance, memory, infrastructure, distributed state, and autonomous execution layers.</p>
      </article>

      <article>
        <h3>CHIMERA: Autonomous Intelligence Architecture</h3>
        <p>An evolving technical specification for hierarchical agents, multi-model routing, speculative local inference, planning, and verification.</p>
      </article>

      <article>
        <h3>NEURAL COMPILER: Runtime for Constrained Hardware</h3>
        <p>Explores execution optimization, model compression, and runtime efficiency for large workloads on resource-constrained devices.</p>
      </article>

      <article>
        <h3>UntitledOS: Custom Operating System</h3>
        <p>An operating system written from scratch covering boot protocols, kernel architecture, memory management, drivers, scheduler, and interactive shell.</p>
      </article>
    </section>
