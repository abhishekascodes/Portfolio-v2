<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(13, 13, 18, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#f3f2ee"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <rect x="60" y="60" width="1080" height="510" rx="36" fill="#f3f2ee" stroke="#0d0d12" stroke-width="3"/>
  
  <!-- Accent badge -->
  <rect x="110" y="110" width="180" height="44" rx="22" fill="#d3ff45" stroke="#0d0d12" stroke-width="2"/>
  <text x="200" y="138" font-family="monospace" font-size="14" font-weight="700" fill="#0d0d12" text-anchor="middle" letter-spacing="1">BUILDER / RESEARCHER</text>
  
  <!-- Headline -->
  <text x="110" y="240" font-family="sans-serif" font-size="84" font-weight="800" fill="#0d0d12" letter-spacing="-3">ABHISHEK A.S.</text>
  <text x="110" y="320" font-family="sans-serif" font-size="34" font-weight="600" fill="#2f3bff" letter-spacing="-1">AI Systems, Mathematics, Distributed State &amp; Hardware</text>
  
  <!-- Philosophy statement -->
  <text x="110" y="380" font-family="serif" font-style="italic" font-size="28" fill="#4b4b57">"I find patterns in everything."</text>
  
  <!-- Pillars -->
  <g transform="translate(110, 440)">
    <rect x="0" y="0" width="180" height="46" rx="23" fill="#cbc2ff" stroke="#0d0d12" stroke-width="2"/>
    <text x="90" y="28" font-family="monospace" font-size="13" font-weight="700" fill="#0d0d12" text-anchor="middle">AI GOVERNANCE</text>
    
    <rect x="195" y="0" width="165" height="46" rx="23" fill="#ffb89a" stroke="#0d0d12" stroke-width="2"/>
    <text x="277" y="28" font-family="monospace" font-size="13" font-weight="700" fill="#0d0d12" text-anchor="middle">CRDT ENGINES</text>
    
    <rect x="375" y="0" width="190" height="46" rx="23" fill="#b4dbff" stroke="#0d0d12" stroke-width="2"/>
    <text x="470" y="28" font-family="monospace" font-size="13" font-weight="700" fill="#0d0d12" text-anchor="middle">FORMAL METHODS</text>
    
    <rect x="580" y="0" width="185" height="46" rx="23" fill="#ffe27a" stroke="#0d0d12" stroke-width="2"/>
    <text x="672" y="28" font-family="monospace" font-size="13" font-weight="700" fill="#0d0d12" text-anchor="middle">HARDWARE &amp; OS</text>
  </g>
  
  <!-- Star emblem -->
  <g transform="translate(970, 240)">
    <circle cx="0" cy="0" r="95" fill="none" stroke="#0d0d12" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="0" cy="0" r="75" fill="#d3ff45" stroke="#0d0d12" stroke-width="2.5"/>
    <path d="M 0 -55 L 14 -14 L 55 0 L 14 14 L 0 55 L -14 14 L -55 0 L -14 -14 Z" fill="#2f3bff" stroke="#0d0d12" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#0d0d12"/>
  </g>
</svg>
